name: Android CI - Cloud Build Engine

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout v4 (Versão mais recente)
      - uses: actions/checkout@v4

      # Setup Java v4 com JDK 17
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Permissão de execução para o Gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Compilação do APK em modo Debug
      - name: Build with Gradle
        run: ./gradlew assembleDebug

      # Upload do APK corrigido para v4
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk